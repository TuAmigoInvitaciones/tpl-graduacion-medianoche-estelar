<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" fill="none" preserveAspectRatio="xMidYMin meet">
  <defs>
    <radialGradient id="tendido-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8d6" stop-opacity="0.95" />
      <stop offset="30%" stop-color="#f8dc8c" stop-opacity="0.56" />
      <stop offset="65%" stop-color="#e8be63" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#e8be63" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="tendido-glass" cx="42%" cy="40%" r="58%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="38%" stop-color="#fff4c7" />
      <stop offset="78%" stop-color="#edd087" />
      <stop offset="100%" stop-color="#c49f54" />
    </radialGradient>

    <linearGradient id="tendido-brass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4e4032" />
      <stop offset="35%" stop-color="#8b765b" />
      <stop offset="70%" stop-color="#6b5945" />
      <stop offset="100%" stop-color="#3f3327" />
    </linearGradient>

    <g id="tendido-bulb">
      <circle cx="0" cy="23" r="32" fill="url(#tendido-glow)" />
      <!-- Brass socket -->
      <rect x="-4" y="0" width="8" height="7" rx="1.5" fill="url(#tendido-brass)" />
      <rect x="-4.8" y="6" width="9.6" height="3.6" rx="1.1" fill="url(#tendido-brass)" />
      <path d="M-2 0 C-2 -2.4, 2 -2.4, 2 0" fill="#5e4e3d" />
      <!-- Round Edison globe -->
      <circle cx="0" cy="22.5" r="12.2" fill="url(#tendido-glass)" stroke="#b89858" stroke-opacity="0.55" stroke-width="0.7" />
      <path d="M-4.2 9.4 Q-4.6 13 -9.4 16.5 L9.4 16.5 Q4.6 13 4.2 9.4 Z" fill="url(#tendido-glass)" />
      <!-- Filament -->
      <path d="M-2.2 13.5 L-1.4 21.5 Q0 24.5 1.4 21.5 L2.2 13.5" stroke="#e89d2a" stroke-width="0.85" stroke-linecap="round" fill="none" opacity="0.85" />
      <circle cx="0" cy="21" r="2.2" fill="#fffdf0" opacity="0.9" />
      <!-- Specular shine -->
      <path d="M-6.8 19 C-6.4 16.2, -4.6 14.5, -3 14" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" opacity="0.72" />
    </g>

    <g id="tendido-bulb-sm">
      <use href="#tendido-bulb" transform="scale(0.76)" />
    </g>
  </defs>

  <!-- Primary edge-to-edge draped festoons anchored at top left-center (215,0) & top right-center (785,0) -->
  <g stroke="#928371" stroke-linecap="round" fill="none">
    <!-- Left edge sweeps into top-left anchor (215, 0) -->
    <path d="M-6 238 Q128 192 215 -2" stroke-width="2.1" opacity="0.88" />
    <path d="M-6 294 Q158 216 215 -2" stroke-width="1.8" opacity="0.8" />
    <path d="M-6 332 Q178 408 328 148" stroke-width="1.8" opacity="0.78" />
    <path d="M-5 237.2 Q128 191.2 215 -2.8" stroke="#cfc2b0" stroke-width="0.75" opacity="0.52" />

    <!-- Center upper double catenary from (215, 0) to (785, 0) -->
    <path d="M215 -2 Q500 176 785 -2" stroke-width="2.2" opacity="0.9" />
    <path d="M215 -2.8 Q500 175.2 785 -2.8" stroke="#cfc2b0" stroke-width="0.8" opacity="0.55" />
    <path d="M215 4 Q492 246 720 60" stroke-width="1.95" opacity="0.82" />

    <!-- Center lower layered festoons from (328, 148) to (680, 146) -->
    <path d="M328 148 Q504 282 680 146" stroke-width="1.85" opacity="0.82" />
    <path d="M328 148 Q494 358 680 146" stroke-width="1.8" opacity="0.78" />
    <path d="M328 148 Q484 422 680 146" stroke-width="1.7" opacity="0.74" />

    <!-- Right edge sweeps from top-right anchor (785, 0) out to x=1006 -->
    <path d="M785 -2 Q876 210 1006 254" stroke-width="2.15" opacity="0.88" />
    <path d="M785 -2.8 Q876 209.2 1006 253.2" stroke="#cfc2b0" stroke-width="0.75" opacity="0.52" />
    <path d="M720 60 Q855 362 1006 346" stroke-width="1.8" opacity="0.78" />
    <path d="M680 146 Q708 110 720 60" stroke-width="1.6" opacity="0.72" />
  </g>

  <!-- Cord knots -->
  <g fill="#7d6e5c">
    <circle cx="215" cy="4" r="2.8" />
    <circle cx="328" cy="148" r="3" />
    <circle cx="680" cy="146" r="2.8" />
    <circle cx="720" cy="60" r="2.8" />
    <circle cx="494" cy="134" r="2.6" />
  </g>

  <!-- Vertical drop cords + warm bulbs -->
  <g stroke="#8e7f6d" stroke-width="1.5" stroke-linecap="round">
    <line x1="46" y1="256" x2="46" y2="294" />
    <use href="#tendido-bulb-sm" x="46" y="294" />

    <line x1="150" y1="168" x2="150" y2="218" />
    <use href="#tendido-bulb" x="150" y="218" />

    <line x1="215" y1="4" x2="215" y2="178" />
    <use href="#tendido-bulb" x="215" y="178" />

    <line x1="300" y1="68" x2="300" y2="136" />
    <use href="#tendido-bulb-sm" x="300" y="136" />

    <line x1="328" y1="148" x2="328" y2="386" />
    <use href="#tendido-bulb-sm" x="328" y="386" />

    <line x1="355" y1="204" x2="355" y2="246" />
    <use href="#tendido-bulb-sm" x="355" y="246" />

    <line x1="456" y1="278" x2="456" y2="320" />
    <use href="#tendido-bulb" x="456" y="320" />

    <line x1="494" y1="134" x2="494" y2="162" />
    <use href="#tendido-bulb-sm" x="494" y="162" />

    <line x1="542" y1="276" x2="542" y2="318" />
    <use href="#tendido-bulb" x="542" y="318" />

    <line x1="634" y1="212" x2="634" y2="242" />
    <use href="#tendido-bulb-sm" x="634" y="242" />

    <line x1="670" y1="162" x2="670" y2="306" />
    <use href="#tendido-bulb-sm" x="670" y="306" />

    <line x1="702" y1="74" x2="702" y2="118" />
    <use href="#tendido-bulb-sm" x="702" y="118" />

    <line x1="708" y1="166" x2="708" y2="394" />
    <use href="#tendido-bulb" x="708" y="394" />

    <line x1="746" y1="116" x2="746" y2="208" />
    <use href="#tendido-bulb" x="746" y="208" />

    <line x1="776" y1="226" x2="776" y2="278" />
    <use href="#tendido-bulb-sm" x="776" y="278" />

    <line x1="782" y1="4" x2="782" y2="28" />
    <use href="#tendido-bulb" x="782" y="28" />

    <line x1="855" y1="222" x2="855" y2="452" />
    <use href="#tendido-bulb" x="855" y="452" />

    <line x1="980" y1="246" x2="980" y2="286" />
    <use href="#tendido-bulb" x="980" y="286" />
  </g>
</svg>
